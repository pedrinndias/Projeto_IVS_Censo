        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Calculado pela pipeline'
        unidade: proporção
        formula: (V00112 + V00113 + V00114 + V00115 + V00116 + V00117 + V00118) / (V00001)
        certificado: false
        armadilhas: NULL quando o denominador é zero ou sigiloso; parcelas sigilosas do numerador entram valendo
          zero (viés para baixo).
      pct_esgoto_inad:
