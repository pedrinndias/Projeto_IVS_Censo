        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        unidade: pessoas
        certificado: false
        armadilhas: 'Minúsculo: total de pessoas. Não confundir com V00001 (domicílios). Pode ser NULL por sigilo.'
      CD_UF:
