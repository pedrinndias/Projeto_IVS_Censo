        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Calculado pela pipeline'
        unidade: proporção
        formula: (V00901) / (V00900 + V00901)
        certificado: false
        armadilhas: 'NULL quando qualquer parcela do denominador é sigilosa (min_count_den=2): em BH, ~22% dos setores
          do recorte ficam sem valor.'
        sinonimos:
        - analfabetismo
        - taxa de analfabetismo
      renda_media:
        descricao: Rendimento nominal médio mensal das pessoas responsáveis (R$)
