        descricao: 1 se SITUACAO = Urbana (recorte de análise do IVS); 0 caso contrário
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Derivado pela pipeline'
        valores:
          1: SITUACAO = Urbana
          0: caso contrário
        certificado: false
      is_fcu:
        descricao: 1 se o setor é de Favela e Comunidade Urbana (CD_TIPO = 1)
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Derivado pela pipeline'
        valores:
          1: setor de favela/comunidade urbana (CD_TIPO = 1)
          0: não FCU
        certificado: false
        sinonimos:
        - favela
        - comunidade urbana
        - FCU
      Moradia_Predominante_Agrupada:
        descricao: Moradia predominante agrupada em Convencional / Não convencional / Indefinido
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Derivado pela pipeline'
        valores:
        - Convencional
        - Não convencional
        - Indefinido
        certificado: false
