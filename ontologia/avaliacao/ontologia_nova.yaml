metricas:
  n_setores_recorte:
    descricao: Número de setores no recorte de análise do IVS.
    expressao: COUNT(setores_censitarios.CD_SETOR)
    tabelas:
    - setores_censitarios
    armadilhas: Recorte definido em metadados.recorte_de_analise.
    fonte: dicionario
    certificado: false
    filtros_obrigatorios:
    - recortes.analise
    unidade: contagem
  media_pct_agua_inad:
    descricao: Média, entre setores, de pct_agua_inad (Proporção de domicílios com abastecimento de água inadequado
      ou ausente).
    expressao: AVG(setores_censitarios.pct_agua_inad)
    tabelas:
    - setores_censitarios
    armadilhas: 'Sigilo do IBGE: X vira NULL; parcelas sigilosas entram valendo zero no numerador (viés para baixo).
      Média simples entre setores; NULL fica fora do AVG.'
    fonte: dicionario
    certificado: false
    filtros_obrigatorios:
    - recortes.analise
    unidade: proporção
  media_pct_esgoto_inad:
    descricao: Média, entre setores, de pct_esgoto_inad (Proporção de domicílios com esgotamento sanitário inadequado
      ou ausente).
    expressao: AVG(setores_censitarios.pct_esgoto_inad)
    tabelas:
    - setores_censitarios
    armadilhas: 'Sigilo do IBGE: X vira NULL; parcelas sigilosas entram valendo zero no numerador (viés para baixo).
      Média simples entre setores; NULL fica fora do AVG.'
    fonte: dicionario
    certificado: false
    filtros_obrigatorios:
    - recortes.analise
    unidade: proporção
  media_pct_lixo_inad:
    descricao: Média, entre setores, de pct_lixo_inad (Proporção de domicílios com destino do lixo inadequado ou
      ausente).
    expressao: AVG(setores_censitarios.pct_lixo_inad)
    tabelas:
    - setores_censitarios
    armadilhas: 'Sigilo do IBGE: X vira NULL; parcelas sigilosas entram valendo zero no numerador (viés para baixo).
      Média simples entre setores; NULL fica fora do AVG.'
    fonte: dicionario
    certificado: false
    filtros_obrigatorios:
    - recortes.analise
    unidade: proporção
  media_pct_analfab:
    descricao: Média, entre setores, de pct_analfab (Taxa de analfabetismo entre pessoas de 15 anos ou mais).
    expressao: AVG(setores_censitarios.pct_analfab)
    tabelas:
    - setores_censitarios
    armadilhas: Média simples entre setores; NULL fica fora do AVG.
    fonte: dicionario
    certificado: false
    filtros_obrigatorios:
    - recortes.analise
    unidade: proporção
  media_pct_raca_pretpardind:
    descricao: Média, entre setores, de pct_raca_pretpardind (Proporção de pessoas de cor/raça preta, parda ou indígena).
    expressao: AVG(setores_censitarios.pct_raca_pretpardind)
    tabelas:
    - setores_censitarios
    armadilhas: Média simples entre setores; NULL fica fora do AVG.
    fonte: dicionario
    certificado: false
    filtros_obrigatorios:
    - recortes.analise
    unidade: proporção
  media_razao_moradores:
    descricao: Média, entre setores, de razao_moradores (Razão de moradores por domicílio (reproduz o V0005 do IBGE)).
    expressao: AVG(setores_censitarios.razao_moradores)
    tabelas:
    - setores_censitarios
    armadilhas: Média simples entre setores; NULL fica fora do AVG.
    fonte: dicionario
    certificado: false
    filtros_obrigatorios:
    - recortes.analise
    unidade: pessoas por domicílio
  media_renda:
    descricao: Média, entre setores, do rendimento nominal médio mensal dos responsáveis, sem o setor extremo.
    expressao: AVG(setores_censitarios.renda_media_sem_extremo)
    tabelas:
    - setores_censitarios
    armadilhas: Use renda_media_sem_extremo (padrão das análises). renda_media original só para reproduzir resultados
      anteriores a 01/09/2026; renda_media_mediana_mun é variante de sensibilidade. Média simples entre setores;
      NULL fica fora do AVG.
    fonte: dicionario
    certificado: false
    filtros_obrigatorios:
    - recortes.analise
    unidade: BRL
    referencia: src/ivs_censo/renda.py (SETORES_RENDA_EXCLUIDA); scripts/pecas_relatorio_raic.py
    historico:
    - valido_ate: '2026-09-01'
      expressao: AVG(setores_censitarios.renda_media)
      motivo: 'Setor 310620005650366 (BH, R$ 170.418) excluído a pedido da orientadora: espremia a normalização
        min-max.'
