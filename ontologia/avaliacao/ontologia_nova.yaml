# ontologia/ontologia.yaml — compilada com a skill ontologia-dados enriquecida
versao: 1
dominio: Censo 2022 (IBGE), agregados por setor censitário dos 70 municípios da amostra ELSI-Brasil, com os indicadores
  do IVS calculados pela pipeline do projeto.
tabelas:
  setores_censitarios:
    termo: Setor censitário
    descricao: Variáveis do Censo 2022 e indicadores derivados por setor censitário.
    granularidade: uma linha por setor censitário
    chave:
    - CD_SETOR
    fonte: dicionario
    certificado: false
    colunas:
      CD_SETOR:
        descricao: 'Geocódigo do setor censitário (15 dígitos): UF(2) + município(5) + distrito, subdistrito e setor'
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        certificado: false
      SITUACAO:
        descricao: 'Situação do setor: Urbana ou Rural (vazia nos setores de massa d''água)'
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        valores:
          Urbana: setor urbano
          Rural: setor rural
          'NULL': massa d'água
        certificado: false
      CD_SIT:
        descricao: 'Código da situação do setor: 1-3 = urbana; 5-8 = rural; 9 = massa d''água (população zero)'
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        valores:
          1-3: urbana
          5-8: rural
          '9': massa d'água (população zero)
        certificado: false
      CD_TIPO:
        descricao: Tipo de setor. 1 = Favela e Comunidade Urbana (FCU); 0 = setor não especial; demais códigos =
          outros setores especiais
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        valores:
          '0': setor não especial
          '1': Favela e Comunidade Urbana (FCU)
          2-9: outros setores especiais
        certificado: false
      NM_MUN:
        descricao: Nome do município
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        certificado: false
        armadilhas: 'Filtre por igualdade (NM_MUN = ''São Paulo''), nunca LIKE: existe ''São Paulo das Missões''.'
      NM_BAIRRO:
        descricao: Nome do bairro, quando o setor pertence a um bairro delimitado
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        certificado: false
      CD_FCU:
        descricao: Código da Favela ou Comunidade Urbana à qual o setor pertence
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        certificado: false
      NM_FCU:
        descricao: Nome da Favela ou Comunidade Urbana à qual o setor pertence
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Censo 2022 (IBGE)'
        certificado: false
      v0001:
        descricao: Total de pessoas
