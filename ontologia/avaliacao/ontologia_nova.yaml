        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Calculado pela pipeline'
        unidade: BRL
        formula: V06004 (valor direto, sem denominador)
        certificado: false
        armadilhas: Valor original com o setor extremo 310620005650366; as análises usam renda_media_sem_extremo.
      renda_media_sem_extremo:
        descricao: 'Igual a renda_media, exceto nos setores excluídos nominalmente, onde fica vazia. Hoje é um só:
          310620005650366 — Belo Horizonte, bairro Senhor dos Passos: R$ 170.418,06, maior valor da base e 55,7×
          a mediana do município. Setor de favela (CD_TIPO=1) com 186 domicílios, 518 pessoas e 31 analfabetos —
          classificado SUSPEITO por três testes de incoerência. Excluído a pedido da orientadora em 01/09/2026.
          A coluna renda_media continua ao lado, sem alteração, para a exclusão ser auditável.'
        fonte: dicionario
        referencia: 'dicionario_variaveis (tabela do próprio banco); origem: Derivado pela pipeline'
        unidade: BRL
        certificado: false
        armadilhas: Padrão das análises desde 01/09/2026.
